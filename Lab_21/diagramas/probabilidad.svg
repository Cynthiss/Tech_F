<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" font-family="Segoe UI, Arial, sans-serif"><rect width="680" height="360" fill="#ffffff"/><title>Probabilidad de que un tramposo pase n rondas</title><text x="340" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#312e81">Un tramposo pasa n rondas con probabilidad ½ⁿ</text><rect x="50" y="70.0" width="40" height="230.0" rx="4" fill="#ef4444"/><text x="70" y="62.0" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">1/2</text><text x="70" y="320" text-anchor="middle" font-size="14" fill="#374151">1</text><rect x="108" y="185.0" width="40" height="115.0" rx="4" fill="#ef4444"/><text x="128" y="177.0" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">1/4</text><text x="128" y="320" text-anchor="middle" font-size="14" fill="#374151">2</text><rect x="166" y="242.5" width="40" height="57.5" rx="4" fill="#ef4444"/><text x="186" y="234.5" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">1/8</text><text x="186" y="320" text-anchor="middle" font-size="14" fill="#374151">3</text><rect x="224" y="271.25" width="40" height="28.75" rx="4" fill="#ef4444"/><text x="244" y="263.25" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">1/16</text><text x="244" y="320" text-anchor="middle" font-size="14" fill="#374151">4</text><rect x="282" y="285.625" width="40" height="14.375" rx="4" fill="#ef4444"/><text x="302" y="277.625" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">1/32</text><text x="302" y="320" text-anchor="middle" font-size="14" fill="#374151">5</text><rect x="340" y="292.8125" width="40" height="7.1875" rx="4" fill="#ef4444"/><text x="360" y="284.8125" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">1/64</text><text x="360" y="320" text-anchor="middle" font-size="14" fill="#374151">6</text><rect x="398" y="296.40625" width="40" height="3.59375" rx="4" fill="#ef4444"/><text x="418" y="288.40625" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">1/128</text><text x="418" y="320" text-anchor="middle" font-size="14" fill="#374151">7</text><rect x="456" y="297" width="40" height="3" rx="4" fill="#ef4444"/><text x="476" y="289" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">1/256</text><text x="476" y="320" text-anchor="middle" font-size="14" fill="#374151">8</text><rect x="514" y="297" width="40" height="3" rx="4" fill="#ef4444"/><text x="534" y="289" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">1/512</text><text x="534" y="320" text-anchor="middle" font-size="14" fill="#374151">9</text><rect x="572" y="297" width="40" height="3" rx="4" fill="#ef4444"/><text x="592" y="289" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">1/1024</text><text x="592" y="320" text-anchor="middle" font-size="14" fill="#374151">10</text><line x1="40" y1="300" x2="640" y2="300" stroke="#9ca3af" stroke-width="2"/><text x="340" y="340" text-anchor="middle" font-size="13" fill="#6b7280">número de rondas (n)</text><text x="420" y="110" font-size="14" fill="#374151">Caer en las primeras 4 rondas:</text><text x="420" y="132" font-size="20" font-weight="700" fill="#dc2626">1 − 1/16 = 93.75 %</text><text x="420" y="160" font-size="14" fill="#374151">Pasar las 10 rondas: 1/1024 ≈ 0.098 %</text></svg>
