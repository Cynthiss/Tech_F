stroke="#9ca3af"/><rect x="580" y="52" width="70" height="52" fill="#eef2ff" stroke="#6b7280"/><text x="615.0" y="76.0" text-anchor="middle" font-size="12" font-weight="700" fill="#312e81">Cayó en</text><text x="615.0" y="91.0" text-anchor="middle" font-size="12" font-weight="700" fill="#312e81">la ronda</text><rect x="580" y="104" width="70" height="42" fill="#fff" stroke="#9ca3af"/><rect x="580" y="146" width="70" height="42" fill="#fff" stroke="#9ca3af"/><rect x="580" y="188" width="70" height="42" fill="#fff" stroke="#9ca3af"/><rect x="580" y="230" width="70" height="42" fill="#fff" stroke="#9ca3af"/><rect x="580" y="272" width="70" height="42" fill="#fff" stroke="#9ca3af"/><rect x="580" y="314" width="70" height="42" fill="#fff" stroke="#9ca3af"/><rect x="650" y="52" width="80" height="52" fill="#eef2ff" stroke="#6b7280"/><text x="690.0" y="76.0" text-anchor="middle" font-size="12" font-weight="700" fill="#312e81">½ⁿ</text><text x="690.0" y="91.0" text-anchor="middle" font-size="12" font-weight="700" fill="#312e81">(a mano)</text><rect x="650" y="104" width="80" height="42" fill="#fff" stroke="#9ca3af"/><rect x="650" y="146" width="80" height="42" fill="#fff" stroke="#9ca3af"/><rect x="650" y="188" width="80" height="42" fill="#fff" stroke="#9ca3af"/><rect x="650" y="230" width="80" height="42" fill="#fff" stroke="#9ca3af"/><rect x="650" y="272" width="80" height="42" fill="#fff" stroke="#9ca3af"/><rect x="650" y="314" width="80" height="42" fill="#fff" stroke="#9ca3af"/><text x="20" y="382" font-size="13" fill="#374151">• Probador: usen una letra (A, B, C…), no nombres.  • Marca ✓ o ✗ en cada ronda y PARA en el primer ✗.</text><text x="20" y="402" font-size="13" fill="#374151">• ½ⁿ: la probabilidad de que un tramposo pase n rondas (n = rondas que pasó). Ej.: pasó 3 → 1/8 = 12.5 %.</text><text x="20" y="428" font-size="13" font-weight="700" fill="#312e81">Preguntas (escribe la respuesta debajo):</text><text x="20" y="448" font-size="13" fill="#374151">1) ¿El verificador aprendió la palabra?    2) ¿Una foto de tus anotaciones convencería a otro trío?</text></svg>
