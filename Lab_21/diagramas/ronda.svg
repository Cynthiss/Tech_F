<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" font-family="Segoe UI, Arial, sans-serif"><rect width="760" height="290" fill="#ffffff"/><title>Una ronda de la cueva en cinco pasos</title><text x="380" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#312e81">Una ronda, paso a paso</text><rect x="20" y="60" width="132" height="150" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/><circle cx="42" cy="82" r="14" fill="#2563eb"/><text x="42" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text><text x="86" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">P entra</text><text x="86" y="146" text-anchor="middle" font-size="12.5" fill="#374151">escribe A o B</text><text x="86" y="166" text-anchor="middle" font-size="12.5" fill="#374151">boca abajo</text><text x="160" y="140" text-anchor="middle" font-size="22" fill="#9ca3af">›</text><rect x="168" y="60" width="132" height="150" rx="12" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/><circle cx="190" cy="82" r="14" fill="#16a34a"/><text x="190" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text><text x="234" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">V lanza la moneda</text><text x="234" y="146" text-anchor="middle" font-size="12.5" fill="#374151">cara = A</text><text x="234" y="166" text-anchor="middle" font-size="12.5" fill="#374151">sello = B</text><text x="308" y="140" text-anchor="middle" font-size="22" fill="#9ca3af">›</text><rect x="316" y="60" width="132" height="150" rx="12" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/><circle cx="338" cy="82" r="14" fill="#16a34a"/><text x="338" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text><text x="382" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">V pide salir</text><text x="382" y="146" text-anchor="middle" font-size="12.5" fill="#374151">por el lado que</text><text x="382" y="166" text-anchor="middle" font-size="12.5" fill="#374151">salió en la moneda</text><text x="456" y="140" text-anchor="middle" font-size="22" fill="#9ca3af">›</text><rect x="464" y="60" width="132" height="150" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/><circle cx="486" cy="82" r="14" fill="#2563eb"/><text x="486" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">4</text><text x="530" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">P sale</text><text x="530" y="146" text-anchor="middle" font-size="12.5" fill="#374151">SÍ sabe: siempre sale</text><text x="530" y="166" text-anchor="middle" font-size="12.5" fill="#374151">NO sabe: acierta ½</text><text x="604" y="140" text-anchor="middle" font-size="22" fill="#9ca3af">›</text><rect x="612" y="60" width="132" height="150" rx="12" fill="#f8fafc" stroke="#6b7280" stroke-width="2"/><circle cx="634" cy="82" r="14" fill="#6b7280"/><text x="634" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">5</text><text x="678" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#6b7280">Anotador marca</text><text x="678" y="146" text-anchor="middle" font-size="12.5" fill="#374151">✓ si salió bien</text><text x="678" y="166" text-anchor="middle" font-size="12.5" fill="#374151">✗ y se para</text><text x="380" y="245" text-anchor="middle" font-size="14" fill="#374151">Se repite 10 veces. En el primer ✗ se detiene: ese probador no sabía la palabra.</text><text x="380" y="270" text-anchor="middle" font-size="13" fill="#6b7280">Los roles rotan: Probador (P), Verificador (V) y Anotador.</text></svg>
