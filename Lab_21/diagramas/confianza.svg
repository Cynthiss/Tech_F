<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" font-family="Segoe UI, Arial, sans-serif"><rect width="760" height="360" fill="#ffffff"/><title>Esquema general de una prueba de conocimiento cero y dónde queda la confianza</title>
<text x="380" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#312e81">Dónde queda la confianza (esquema general)</text>
<text x="380" y="52" text-anchor="middle" font-size="13" fill="#6b7280">No es un caso concreto: los datos de cada caso salen de las fuentes del session doc</text>
<rect x="30" y="80" width="190" height="90" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="125" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#b45309">Emisor</text><text x="125" y="140" text-anchor="middle" font-size="13" fill="#374151">afirma y firma el dato</text>
<rect x="285" y="80" width="190" height="90" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="380" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#2563eb">Probador</text><text x="380" y="140" text-anchor="middle" font-size="13" fill="#374151">guarda el dato secreto</text>
<rect x="540" y="80" width="190" height="90" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="635" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#16a34a">Verificador</text><text x="635" y="140" text-anchor="middle" font-size="13" fill="#374151">comprueba la prueba</text>
<text x="252" y="118" text-anchor="middle" font-size="26" fill="#9ca3af">›</text><text x="252" y="146" text-anchor="middle" font-size="11" fill="#6b7280">dato</text><text x="252" y="159" text-anchor="middle" font-size="11" fill="#6b7280">firmado</text>
<text x="507" y="118" text-anchor="middle" font-size="26" fill="#9ca3af">›</text><text x="507" y="146" text-anchor="middle" font-size="11" fill="#6b7280">prueba</text><text x="507" y="159" text-anchor="middle" font-size="11" fill="#6b7280">(sin el dato)</text>
<text x="380" y="215" text-anchor="middle" font-size="15" font-weight="700" fill="#374151">La prueba es válida solo si estos cuatro puntos son confiables:</text>
<rect x="25" y="235" width="170" height="104" rx="12" fill="#f8fafc" stroke="#d97706" stroke-width="2"/><text x="110" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#d97706">Emisor</text><text x="110" y="286" text-anchor="middle" font-size="12" fill="#374151">¿el dato original</text><text x="110" y="304" text-anchor="middle" font-size="12" fill="#374151">es verdad?</text><rect x="210" y="235" width="170" height="104" rx="12" fill="#f8fafc" stroke="#7c3aed" stroke-width="2"/><text x="295" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed">Circuito</text><text x="295" y="286" text-anchor="middle" font-size="12" fill="#374151">¿la regla probada</text><text x="295" y="304" text-anchor="middle" font-size="12" fill="#374151">está bien escrita?</text><rect x="395" y="235" width="170" height="104" rx="12" fill="#f8fafc" stroke="#0891b2" stroke-width="2"/><text x="480" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#0891b2">Ceremonia</text><text x="480" y="286" text-anchor="middle" font-size="12" fill="#374151">¿se destruyó el secreto</text><text x="480" y="304" text-anchor="middle" font-size="12" fill="#374151">de la configuración</text><text x="480" y="322" text-anchor="middle" font-size="12" fill="#374151">confiable (si hay)?</text><rect x="580" y="235" width="170" height="104" rx="12" fill="#f8fafc" stroke="#dc2626" stroke-width="2"/><text x="665" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">Operador</text><text x="665" y="286" text-anchor="middle" font-size="12" fill="#374151">¿quien corre el</text><text x="665" y="304" text-anchor="middle" font-size="12" fill="#374151">sistema actúa bien?</text></svg>
