<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 604" role="img" font-family="Segoe UI, Arial, sans-serif"><title>Ficha de caso para dibujar a mano</title><rect width="760" height="604" fill="#ffffff"/><text x="380" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#312e81">A.2 Ficha de caso (dibujar a mano)</text><text x="20" y="56" font-size="14" fill="#374151">Caso asignado: ________________________  (UE · Zcash · World ID · zk-rollup)</text><rect x="20" y="70" width="270" height="34" fill="#eef2ff" stroke="#6b7280"/><text x="155" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">Fila</text><rect x="290" y="70" width="450" height="34" fill="#eef2ff" stroke="#6b7280"/><text x="515" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">Respuesta (escribir a mano)</text><rect x="20" y="104" width="270" height="52" fill="#f8fafc" stroke="#9ca3af"/><rect x="290" y="104" width="450" height="52" fill="#fff" stroke="#9ca3af"/><text x="28" y="134.0" font-size="12" fill="#374151">1  Qué se prueba (la afirmación)</text><rect x="20" y="156" width="270" height="52" fill="#f8fafc" stroke="#9ca3af"/><rect x="290" y="156" width="450" height="52" fill="#fff" stroke="#9ca3af"/><text x="28" y="186.0" font-size="12" fill="#374151">2  Dato secreto (lo que se esconde)</text><rect x="20" y="208" width="270" height="52" fill="#f8fafc" stroke="#9ca3af"/><rect x="290" y="208" width="450" height="52" fill="#fff" stroke="#9ca3af"/><text x="28" y="238.0" font-size="12" fill="#374151">3  Quién es el probador y quién el verificador</text><rect x="20" y="260" width="270" height="52" fill="#f8fafc" stroke="#9ca3af"/><rect x="290" y="260" width="450" height="52" fill="#fff" stroke="#9ca3af"/><text x="28" y="290.0" font-size="12" fill="#374151">4  Qué ve el verificador</text><rect x="20" y="312" width="270" height="52" fill="#f8fafc" stroke="#9ca3af"/><rect x="290" y="312" width="450" height="52" fill="#fff" stroke="#9ca3af"/><text x="28" y="335.0" font-size="12" fill="#374151">5  ¿Interactiva o no? ¿SNARK o STARK?</text><text x="28" y="350.0" font-size="12" fill="#374151">    ¿Hay configuración confiable?</text><rect x="20" y="364" width="270" height="52" fill="#f8fafc" stroke="#9ca3af"/><rect x="290" y="364" width="450" height="52" fill="#fff" stroke="#9ca3af"/><text x="28" y="387.0" font-size="12" fill="#374151">6  Qué confianza queda (emisor, circuito,</text><text x="28" y="402.0" font-size="12" fill="#374151">    ceremonia, operador): 2 puntos y por qué</text><rect x="20" y="416" width="270" height="52" fill="#f8fafc" stroke="#9ca3af"/><rect x="290" y="416" width="450" height="52" fill="#fff" stroke="#9ca3af"/><text x="28" y="446.0" font-size="12" fill="#374151">7  Una fuente de §9</text><text x="20" y="494" font-size="13" font-weight="700" fill="#312e81">Reflexión (3 líneas):</text><text x="20" y="516" font-size="12.5" fill="#374151">(a) En la cueva, ¿qué convenció al verificador si nunca oyó la palabra?</text><text x="20" y="536" font-size="12.5" fill="#374151">(b) En su caso, ¿en qué punto la ZKP puede probar algo falso si alguien miente o se equivoca?</text><text x="20" y="556" font-size="12.5" fill="#374151">(c) ¿Qué regla de su venture comprobarían así en vez de guardar el dato?</text><text x="20" y="586" font-size="12" fill="#6b7280">Lo que no esté en §4 o §9: escribir "no verificado". Sin datos personales.</text></svg>
